# Builds a signed APK and publishes it on GitHub Releases. The app's built-in updater
# downloads that APK.
#
# Two ways to release:
#  - Run this workflow ("Run workflow" in the Actions tab): it reads versionName from
#    app/build.gradle.kts, builds, signs, and creates the release v<versionName> with
#    the APK attached. Release notes come from fastlane/.../changelogs/<versionCode>.txt.
#  - Or publish a release yourself with tag v<versionName>; the APK is attached to it.
#
# Needs four repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: Release APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Read the app version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "App version $VERSION (code $CODE)"

      - name: Check the version and tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            if [ "${{ github.event.release.tag_name }}" != "$TAG" ]; then
              echo "::error::Release tag ${{ github.event.release.tag_name }} does not match versionName $VERSION. Bump the version or fix the tag."
              exit 1
            fi
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump versionCode and versionName in app/build.gradle.kts first."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed APK
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "WordNerd-$VERSION.apk"

      - name: Publish
        run: |
          APK="WordNerd-$VERSION.apk"
          if [ "${{ github.event_name }}" = "release" ]; then
            gh release upload "$TAG" "$APK" --clobber
          else
            NOTES="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
            [ -f "$NOTES" ] || { echo "Word Nerd $VERSION" > "$RUNNER_TEMP/notes.txt"; NOTES="$RUNNER_TEMP/notes.txt"; }
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Word Nerd $VERSION" --notes-file "$NOTES"
          fi

      - name: Remove signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
